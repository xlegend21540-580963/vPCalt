name: VortexSpike Feasibility CI

on:
  push:
    paths:
      - 'spike/**'
      - '.github/workflows/spike-ci.yml'
  pull_request:
    paths:
      - 'spike/**'
      - '.github/workflows/spike-ci.yml'
  workflow_dispatch:

jobs:
  build-spike-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build all four targetSdk debug APKs (t28, t29, t34, t36)
        run: |
          gradle -p spike \
            assembleT28Debug \
            assembleT29Debug \
            assembleT34Debug \
            assembleT36Debug \
            -PenableNativeBuild=true \
            --no-daemon \
            --console=plain

      - name: Run unit tests on t34Debug
        run: |
          gradle -p spike testT34DebugUnitTest --no-daemon --console=plain

      - name: Verify arm64-v8a native binaries and 16 KB PT_LOAD alignment
        run: |
          mkdir -p /tmp/spike_check
          for flavor in t28 t29 t34 t36; do
            APK="spike/app/build/outputs/apk/${flavor}/debug/app-${flavor}-debug.apk"
            test -f "$APK"
            echo "=== Checking $APK ==="
            unzip -l "$APK" | grep -E "lib/arm64-v8a/(libspike_exec|libspike_jni)\.so"
            unzip -p "$APK" lib/arm64-v8a/libspike_exec.so > "/tmp/spike_check/libspike_exec_${flavor}.so"
            unzip -p "$APK" lib/arm64-v8a/libspike_jni.so > "/tmp/spike_check/libspike_jni_${flavor}.so"
            file "/tmp/spike_check/libspike_exec_${flavor}.so" "/tmp/spike_check/libspike_jni_${flavor}.so"
            if command -v readelf >/dev/null 2>&1; then
              readelf -lW "/tmp/spike_check/libspike_exec_${flavor}.so" | grep -E "Type|LOAD"
              readelf -lW "/tmp/spike_check/libspike_jni_${flavor}.so" | grep -E "Type|LOAD"
            fi
          done

      - name: Upload all four debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: vortex-spike-debug-apks
          path: |
            spike/app/build/outputs/apk/t28/debug/app-t28-debug.apk
            spike/app/build/outputs/apk/t29/debug/app-t29-debug.apk
            spike/app/build/outputs/apk/t34/debug/app-t34-debug.apk
            spike/app/build/outputs/apk/t36/debug/app-t36-debug.apk
          if-no-files-found: error
