name: VortexPC Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake for :native C++ build
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build Debug APK (with NDK C++)
        run: ./gradlew assembleDebug -PenableNativeBuild=true --no-daemon

      - name: Run Unit & Robolectric Tests
        run: ./gradlew testDebugUnitTest --no-daemon
